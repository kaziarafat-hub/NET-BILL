<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14192b;--mu:#6b7390;--pr:#1d5fe0;--ok:#12805c;--bad:#c62828;--wn:#b26a00;--ln:#e3e7f1;--bk:#e2136e;--ng:#f26b21;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1320;--card:#1a2033;--tx:#eef1fa;--mu:#9aa3c0;--pr:#6b9bff;--ok:#4cd0a0;--bad:#ff7b7b;--wn:#ffb74d;--ln:#2a3250;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1320;--card:#1a2033;--tx:#eef1fa;--mu:#9aa3c0;--pr:#6b9bff;--ok:#4cd0a0;--bad:#ff7b7b;--wn:#ffb74d;--ln:#2a3250;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.nw{flex-wrap:nowrap}
.mu{color:var(--mu);font-size:13px}.big{font-size:26px;font-weight:700}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pr);color:#fff;cursor:pointer;font-weight:600}
button.g{background:transparent;color:var(--pr);border:1px solid var(--ln)}button.sm{padding:6px 10px;font-size:13px}button.r{background:var(--bad)}button.k{background:var(--ok)}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--ln)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wn{color:var(--wn)}
.banner{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;background:#fff3cd;color:#664d03}.banner.i{background:#dbe8ff;color:#0b2a66}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));overflow-x:auto}
.nav button{background:transparent;color:var(--mu);padding:8px 12px;flex:0 0 auto;margin:0 auto}.nav button.on{color:var(--pr);background:var(--bg)}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;margin:6px 0;background:var(--ln)}.me{margin-left:auto;background:var(--pr);color:#fff}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;overflow:auto}.modal .card{width:100%;max-width:400px}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1;background:var(--bg);color:var(--tx);border:2px solid var(--ln)}.seg button.on{border-color:var(--pr)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi .card{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-size:14px}
.bar{height:8px;border-radius:9px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
@media print{#app>*:not(.modal),.nav{display:none}.modal{position:static;background:none}.modal button{display:none}}
.rc{font-family:ui-monospace,Menlo,monospace;font-size:13px;border:1px dashed var(--mu);padding:10px;border-radius:10px}

 if(U.tab=='sup'){const ids=[...new Set(S.ch.map(x=>x.cid))];
  h+=`<div class="seg">${ids.map(i=>`<button class="${U.thread==i?'on':''}" onclick="U.thread=${i};draw()">${esc(cu(i)?.name||i)} ${S.tk[i]=='open'?'🔴':''}</button>`).join('')||'<p class="mu">No messages yet.</p>'}</div>`;
  if(U.thread)h+=`<div class="card"><div class="row"><b>${esc(cu(U.thread)?.name||'')}</b><button class="g sm" onclick="resolve()">${S.tk[U.thread]=='open'?'Mark resolved':'Resolved ✓'}</button></div>${S.ch.filter(x=>x.cid==U.thread).map(x=>`<div class="msg ${x.from=='a'?'me':''}">${esc(x.text)}</div>`).join('')}<div class="row nw"><input id="am" placeholder="Reply"><button onclick="send('a')">Send</button></div></div>`}
 if(U.tab=='more'){const rq=S.rq.filter(r=>r.st=='new');
  h+=`<h2>Packages</h2><div class="card"><input id="p1" placeholder="Name"><input id="p2" placeholder="Speed (Mbps)" inputmode="numeric"><input id="p3" placeholder="Price / month" inputmode="numeric"><button onclick="addP()">Add package</button></div>`+
  S.pk.map(p=>`<div class="card row"><div><b>${esc(p.name)}</b><div class="mu">${p.speed?p.speed+' Mbps · ':''}${S.cu.filter(c=>c.pk==p.id).length} customers</div></div><div class="row nw"><input id="pp${p.id}" value="${p.price}" style="width:90px"><button class="sm" onclick="setP(${p.id})">Save</button></div></div>`).join('');
  if(rq.length)h+=`<h2>Package change requests</h2>`+rq.map(r=>`<div class="card row"><div><b>${esc(cu(r.cid)?.name||'?')}</b><div class="mu">→ ${esc(pk(r.pk).name)}</div></div><div><button class="k sm" onclick="upr(${r.id},1)">Approve</button> <button class="r sm" onclick="upr(${r.id},0)">Deny</button></div></div>`).join('');
  h+=`<h2>Network outage alert</h2><div class="card"><select id="oa">${[...new Set(S.cu.map(c=>c.addr))].map(a=>`<option>${esc(a)}</option>`).join('')}</select><input id="ot" placeholder="e.g. Fiber cut, fixing by 6 PM"><button onclick="outage()">Alert this area</button>${S.ou.map(o=>`<div class="row" style="margin-top:8px"><span>🚧 ${esc(o.area)}: ${esc(o.text)}</span><button class="g sm" onclick="clr(${o.id})">Clear</button></div>`).join('')}</div>
  <h2>Expenses</h2><div class="card"><div class="row nw"><select id="xc"><option>Fixed</option><option>Salary / Honorarium</option><option>Daily</option><option>Mobile bill</option><option>LKB</option></select><input id="xa" placeholder="Amount" inputmode="numeric"></div><button onclick="addX()">Add expense</button>${S.ex.slice().reverse().slice(0,6).map(e=>`<div class="row mu" style="margin-top:6px"><span>${esc(e.cat)} · ${e.on}</span><span>${fmt(e.amt)}</span></div>`).join('')}</div>

 return h+nav([['dash','📊 Home'],['cust','👥 Customers'],['bill','🧾 Bills'+(pendN?' 🔴':'')],['due','⚠️ Dues'],['exp','💸 Expenses'],['ins','📈 Insights'],['sup','💬 Support'],['more','⚙️ More']])}
function addC(){const n=$('n1').value.trim(),ph=$('n2').value.trim(),pin=$('n3').value.trim();if(!n||!ph||!/^\d{4}$/.test(pin))return toast('Name, phone and 4-digit PIN required');
 const id=Math.max(1000,...S.cu.map(c=>c.id))+1;S.cu.push({id,name:n,phone:ph,pin,pk:+$('n4').value,st:'active',since:M,addr:$('n5').value.trim()});log('Added customer '+n);save();draw();toast('Customer #'+id+' added')}
function saveC(id){const c=cu(id);Object.assign(c,{name:$('e1').value.trim()||c.name,phone:$('e2').value.trim(),addr:$('e5').value.trim(),pin:$('e3').value.trim()||c.pin,pk:+$('e4').value});log('Edited '+c.name);U.ed=null;save();draw()}
function delC(id){if(U.dc!=id){U.dc=id;return toast('Tap Delete again to confirm')}U.dc=null;log('Deleted '+cu(id).name);S.cu=S.cu.filter(c=>c.id!=id);S.bl=S.bl.filter(b=>b.cid!=id);S.ch=S.ch.filter(x=>x.cid!=id);U.ed=null;save();draw()}
function tog(id){const c=cu(id);c.st=c.st=='active'?'expired':'active';log((c.st=='active'?'Reconnected ':'Disconnected ')+c.name);save();draw()}
function gen(){let n=0;S.cu.filter(c=>c.st=='active').forEach(c=>{if(!S.bl.some(b=>b.cid==c.id&&b.m==M)){S.bl.push({id:Date.now()+n,cid:c.id,m:M,amt:pk(c.pk).price,fine:0,st:'due'});n++}});log(`Generated ${n} bills for ${M}`);save();draw();toast(n+' new bill(s) generated')}
function paid(b,via,trx){Object.assign(b,{st:'paid',via,trx,on:today()});const c=cu(b.cid);if(c&&c.st=='expired'&&!due(c.id))c.st='active'}
function rcv(id){const b=S.bl.find(b=>b.id==id);paid(b,'Cash','');log(`Cash received ${fmt(b.amt)} from ${cu(b.cid).name}`);save();draw()}
function appr(id){const b=S.bl.find(b=>b.id==id);paid(b,b.via,b.trx);log(`Approved ${b.via} ${b.trx}`);save();draw()}
function rej(id){const b=S.bl.find(b=>b.id==id);S.ch.push({cid:b.cid,from:'a',text:`Your ${b.via} payment (${b.trx}) could not be verified. Please check the transaction ID and pay again.`,t:now()});b.st='due';log('Rejected '+b.trx);save();draw()}
function remind(id){const c=cu(id);log(`SMS to ${c.phone}: bill due ${fmt(due(id))}`);save();toast('SMS reminder queued (demo)')}
function remindAll(){const l=S.cu.filter(c=>due(c.id)>0);l.forEach(c=>log(`SMS to ${c.phone}: bill due ${fmt(due(c.id))}`));save();toast(l.length+' reminders queued (demo)')}
function fine(){let n=0;S.bl.filter(b=>b.st=='due'&&b.m<M&&!b.fine).forEach(b=>{b.fine=Math.round(b.amt*.05);b.amt+=b.fine;n++});log(`Late fee applied to ${n} bills`);save();draw();toast(n+' bill(s) updated')}
function susp(){let n=0;S.cu.filter(c=>c.st=='active'&&bd(c.id,'due').some(b=>b.m<M)).forEach(c=>{c.st='expired';n++});log(`Suspended ${n} overdue customers`);save();draw();toast(n+' customer(s) suspended')}
function resolve(){S.tk[U.thread]=S.tk[U.thread]=='open'?'done':'open';save();draw()}
function addP(){const n=$('p1').value.trim(),s=+$('p2').value,p=+$('p3').value;if(!n||!s||!p)return toast('Fill all fields');S.pk.push({id:Date.now(),name:n,speed:s,price:p});save();draw()}
function setP(id){const v=+$('pp'+id).value;if(v>0){pk(id).price=v;log('Price updated: '+pk(id).name);save();toast('Saved (applies to new bills)')}}
function upr(id,ok){const r=S.rq.find(r=>r.id==id);r.st=ok?'ok':'no';if(ok)cu(r.cid).pk=r.pk;log((ok?'Approved':'Denied')+' package change for '+cu(r.cid).name);save();draw()}
function notice(){const v=$('nt').value.trim();if(!v)return;S.nt.unshift({id:Date.now(),text:v,on:today()});log('Notice published');save();draw();toast('Notice published')}
function csv(t){U.csv=t=='c'?'id,name,phone,package,status,due\n'+S.cu.map(c=>[c.id,c.name,c.phone,pk(c.pk).name,c.st,due(c.id)].join(',')).join('\n'):'date,customer,month,amount,method,trx\n'+S.bl.filter(b=>b.st=='paid').map(b=>[b.on,cu(b.cid)?.name,b.m,b.amt,b.via,b.trx||''].join(',')).join('\n');draw()}
const exM=()=>sum(S.ex.filter(e=>e.on.startsWith(M)));
function theme(){const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'}
function outage(){const t=$('ot').value.trim();if(!t)return toast('Write a short message');S.ou.push({id:Date.now(),area:$('oa').value,text:t});log('Outage alert: '+$('oa').value);save();draw();toast('Customers in that area will see it')}
function clr(id){S.ou=S.ou.filter(o=>o.id!=id);save();draw()}
function addX(){const a=+$('xa').value;if(!a)return toast('Enter an amount');S.ex.push({id:Date.now(),cat:$('xc').value,amt:a,on:M+'-'+today().slice(8,10)});log('Expense '+fmt(a)+' · '+$('xc').value);save();draw()}
function quick(x){S.ch.push({cid:U.user,from:'c',text:'⚠️ '+x,t:now()});S.tk[U.user]='open';save();draw();toast('Support team notified')}
function speed(){const c=cu(U.user),s=pk(c.pk).speed;if(c.st!='active'){$('sp').textContent='Connection expired. Pay your due first.';return}let i=0;const t=setInterval(()=>{i++;const e=$('sp');if(!e)return clearInterval(t);if(i<14)e.textContent='Testing… '+(Math.random()*s).toFixed(1)+' Mbps';else{clearInterval(t);e.innerHTML=`<b class="big">${(s*(.85+Math.random()*.14)).toFixed(1)} Mbps</b> ↓ · ping ${8+Math.floor(Math.random()*15)} ms (simulated)`}},110)}
const addM=(m,i)=>{const [y,o]=m.split('-').map(Number),t=y*12+o-1+i;return Math.floor(t/12)+'-'+String(t%12+1).padStart(2,'0')};
const adv=()=>{const n=(U.pay&&U.pay.adv)||0,c=cu(U.user);return n&&c?Math.round(pk(c.pk).price*n*(n>=6?.9:.95)):0};
